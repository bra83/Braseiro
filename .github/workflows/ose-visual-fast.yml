name: BRASEIRO OSE Visual Fast
on:
  workflow_dispatch:
  push:
    branches: [ose-session-visual-lock-strict-2]
    paths:
      - 'ose/web-ui/src/app.ts'
      - 'ose/web-ui/src/styles.css'
      - 'ose/web-ui/tests/capture.spec.ts'
      - 'ose/web-ui/src/assets/*.png'
      - '.github/workflows/ose-visual-fast.yml'
permissions:
  contents: read
jobs:
  visual-fast:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ose/web-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: npm install
        run: npm install --ignore-scripts
      - name: npm run build
        run: npm run build
      - name: Playwright install
        run: npx playwright install --with-deps chromium
      - name: Playwright 415x915 real DOM captures
        run: npm run test:capture
      - name: Upload real Session captures
        uses: actions/upload-artifact@v4
        with:
          name: BRASEIRO_OSE_VISUAL_FAST_CAPTURES_V3
          path: |
            ose/web-ui/captures/SESSION_PRESTART_REAL_415x915.png
            ose/web-ui/captures/SESSION_ACTIVE_REAL_415x915.png
            ose/web-ui/captures/SESSION_KEYBOARD_REAL_415x915.png
          if-no-files-found: error
