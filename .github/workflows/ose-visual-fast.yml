name: BRASEIRO OSE Visual Fast
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  visual-fast:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ose/web-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate pinned binary assets
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, hashlib, struct
          from pathlib import Path
          root=Path('src/assets')
          pin=json.loads((root/'VISUAL_LOCK_BINARY_PIN.json').read_text())
          missing=[]
          for e in pin['files']:
              p=root/e['filename']
              if not p.is_file() or p.stat().st_size <= 0:
                  missing.append(str(p)); continue
              b=p.read_bytes()
              if hashlib.sha256(b).hexdigest()!=e['sha256']:
                  raise SystemExit(f'sha256 mismatch: {p}')
              if b[:8] != b'\x89PNG\r\n\x1a\n' or b[12:16] != b'IHDR':
                  raise SystemExit(f'not PNG: {p}')
              w,h=struct.unpack('>II',b[16:24])
              if (w,h)!=(e['width'],e['height']):
                  raise SystemExit(f'dim mismatch {p}: {(w,h)}')
          if missing:
              raise SystemExit('missing/empty: '+', '.join(missing))
          print('MISSING_PINNED_ASSETS=0')
          print(f'BINARY_ASSET_INTEGRITY=PASS files={len(pin["files"])}')
          PY
      - run: npm install --ignore-scripts
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Playwright 415x915 + real overlay + anchors
        run: npm run test:capture
      - uses: actions/upload-artifact@v4
        with:
          name: BRASEIRO_OSE_VISUAL_FAST_CAPTURES_V2
          path: |
            ose/web-ui/captures/SESSION_PRESTART_REAL_415x915.png
            ose/web-ui/captures/SESSION_ACTIVE_REAL_415x915.png
            ose/web-ui/captures/SESSION_KEYBOARD_REAL_415x915.png
            ose/web-ui/captures/DEBUG_PRESTART_OVERLAY_50.png
            ose/web-ui/captures/DEBUG_ACTIVE_OVERLAY_50.png
            ose/web-ui/src/assets/VISUAL_LOCK_BINARY_PIN.json
          if-no-files-found: error
