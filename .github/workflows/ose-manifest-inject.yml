name: BRASEIRO OSE Manifest Injection

on:
  push:
    branches: [ose-batch-a]
    paths:
      - ".github/workflows/ose-manifest-inject.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ose-batch-a
          fetch-depth: 0
      - name: Reconstruct exact attached Visual Forge manifest
        shell: bash
        run: |
          set -euo pipefail
          cat ose/assets/.manifest_payload/part*.b64 | tr -d '\n\r' | base64 -d > /tmp/ASSET_MANIFEST.json.gz
          gzip -dc /tmp/ASSET_MANIFEST.json.gz > ose/assets/ASSET_MANIFEST.json
          test "$(stat -c '%s' ose/assets/ASSET_MANIFEST.json)" = "315559"
          echo "769fa3b9893dc8a4108646783740a0caaa9971c6f90fd44d6e9309792e7301e4  ose/assets/ASSET_MANIFEST.json" | sha256sum --check --strict
          python3 - <<'PY'
          import json
          p='ose/assets/ASSET_MANIFEST.json'
          with open(p,'r',encoding='utf-8') as f: d=json.load(f)
          assert d['schema']=='BRASEIRO_VISUAL_FORGE_ASSET_MANIFEST_V2'
          pin_path='ose/assets/manifest-pin.json'
          with open(pin_path,'r',encoding='utf-8') as f: pin=json.load(f)
          pin['source']='vendored exact Visual Forge canonical ASSET_MANIFEST.json'
          pin.pop('driveFileId',None)
          pin.pop('downloadUrl',None)
          pin['vendoredPath']='ose/assets/ASSET_MANIFEST.json'
          pin['sha256']='769fa3b9893dc8a4108646783740a0caaa9971c6f90fd44d6e9309792e7301e4'
          pin['schema']='BRASEIRO_VISUAL_FORGE_ASSET_MANIFEST_V2'
          pin['policy']='CI and runtime use the bundled, hash-verified canonical manifest; no network fetch is permitted or required.'
          with open(pin_path,'w',encoding='utf-8') as f:
              json.dump(pin,f,ensure_ascii=False,indent=2)
              f.write('\n')
          PY
      - name: Commit exact vendored manifest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ose/assets/ASSET_MANIFEST.json ose/assets/manifest-pin.json
          git commit -m "Vendor exact canonical OSE asset manifest"
          git push origin HEAD:ose-batch-a
