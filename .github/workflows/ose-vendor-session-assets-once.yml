name: BRASEIRO OSE Batch Vendor Pinned Assets
on:
  push:
    branches: [ose-session-visual-lock-strict-2]
    paths:
      - '.github/workflows/ose-vendor-session-assets-once.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  vendor-batch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ose-session-visual-lock-strict-2
          fetch-depth: 1

      - name: Reconstruct already-bootstrapped canonical binaries
        shell: bash
        working-directory: ose/web-ui
        run: |
          set -euo pipefail
          root=src/assets
          if compgen -G "$root/.bootstrap-a201/part*.txt" >/dev/null; then
            cat "$root"/.bootstrap-a201/part*.txt | tr -d '\n\r' | base64 -d > "$root/OSE_GLOBAL_A201_botao_base_neutro_sem_texto.png"
          fi
          if compgen -G "$root/.bootstrap-a202/part*.txt" >/dev/null; then
            cat "$root"/.bootstrap-a202/part*.txt | tr -d '\n\r' | base64 -d > "$root/OSE_GLOBAL_A202_botao_base_ativo_sem_texto.png"
          fi
          if [ -f "$root/.bootstrap-special/OSE_SESSION_A501_icone_gm_help.b64" ]; then
            tr -d '\n\r' < "$root/.bootstrap-special/OSE_SESSION_A501_icone_gm_help.b64" | base64 -d > "$root/OSE_SESSION_A501_icone_gm_help.png"
          fi
          if [ -f "$root/.bootstrap-special/OSE_SESSION_A502_frame_narracao_flexivel.b64" ]; then
            tr -d '\n\r' < "$root/.bootstrap-special/OSE_SESSION_A502_frame_narracao_flexivel.b64" | base64 -d > "$root/OSE_SESSION_A502_frame_narracao_flexivel.png"
          fi

      - name: Fetch every remaining pin in one batch
        shell: bash
        working-directory: ose/web-ui
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet 'gdown==5.2.0'
          python3 - <<'PY'
          import json, hashlib, struct, shutil
          from pathlib import Path
          import gdown

          root=Path('src/assets')
          pin=json.loads((root/'VISUAL_LOCK_BINARY_PIN.json').read_text())

          def exact(p,e):
              if not p.is_file() or p.stat().st_size <= 0:
                  return False
              b=p.read_bytes()
              if hashlib.sha256(b).hexdigest()!=e['sha256']:
                  return False
              if b[:8] != b'\x89PNG\r\n\x1a\n' or b[12:16] != b'IHDR':
                  return False
              w,h=struct.unpack('>II',b[16:24])
              return (w,h)==(e['width'],e['height'])

          failures=[]
          for e in pin['files']:
              out=root/e['filename']
              if exact(out,e):
                  print('PIN_READY',e['filename'])
                  continue
              tmp=out.with_suffix(out.suffix+'.download')
              tmp.unlink(missing_ok=True)
              ok=False
              for cookies in (True,False):
                  try:
                      got=gdown.download(id=e['source_drive_file_id'], output=str(tmp), quiet=False, use_cookies=cookies)
                  except Exception as exc:
                      print('GDOWN_EXCEPTION',e['filename'],repr(exc))
                      got=None
                  if got and exact(tmp,e):
                      shutil.move(tmp,out)
                      ok=True
                      break
                  if tmp.exists():
                      print('GDOWN_REJECT',e['filename'],hashlib.sha256(tmp.read_bytes()).hexdigest(),tmp.stat().st_size)
                      tmp.unlink()
              if not ok:
                  failures.append(e['filename'])
              else:
                  print('PIN_FETCHED',e['filename'])
          if failures:
              raise SystemExit('BATCH_FETCH_FAILED: '+', '.join(failures))
          PY

      - name: Validate complete pin batch before Playwright
        shell: bash
        working-directory: ose/web-ui
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,hashlib,struct
          from pathlib import Path
          root=Path('src/assets')
          pin=json.loads((root/'VISUAL_LOCK_BINARY_PIN.json').read_text())
          missing=[]
          for e in pin['files']:
              p=root/e['filename']
              if not p.is_file() or p.stat().st_size <= 0:
                  missing.append(e['filename']); continue
              b=p.read_bytes()
              got=hashlib.sha256(b).hexdigest()
              if got != e['sha256']:
                  raise SystemExit(f'SHA mismatch {p.name}: {got} != {e["sha256"]}')
              if b[:8] != b'\x89PNG\r\n\x1a\n' or b[12:16] != b'IHDR':
                  raise SystemExit(f'not valid PNG: {p.name}')
              w,h=struct.unpack('>II',b[16:24])
              if (w,h)!=(e['width'],e['height']):
                  raise SystemExit(f'dim mismatch {p.name}: {(w,h)} != {(e["width"],e["height"])}')
          if missing:
              raise SystemExit('MISSING_PINNED_ASSETS='+str(len(missing))+' '+','.join(missing))
          print('MISSING_PINNED_ASSETS=0')
          print('BINARY_ASSET_INTEGRITY=PASS')
          print('PINNED_FILES='+str(len(pin['files'])))
          PY

      - name: Clean bootstrap residue and re-enable Visual Fast
        shell: bash
        run: |
          set -euo pipefail
          rm -rf ose/web-ui/src/assets/.bootstrap-a201 ose/web-ui/src/assets/.bootstrap-a202 ose/web-ui/src/assets/.bootstrap-special
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/ose-visual-fast.yml')
          s=p.read_text()
          old="on:\n  workflow_dispatch:\npermissions:"
          new="on:\n  push:\n    branches: [ose-session-visual-lock-strict-2]\n    paths:\n      - 'ose/web-ui/**'\n      - '.github/workflows/ose-visual-fast.yml'\n  workflow_dispatch:\npermissions:"
          if old not in s:
              raise SystemExit('Visual Fast pause marker not found')
          p.write_text(s.replace(old,new,1))
          PY
          git rm .github/workflows/ose-vendor-session-assets-once.yml

      - name: Commit complete canonical batch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'braseiro-build-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add ose/web-ui/src/assets .github/workflows/ose-visual-fast.yml
          git commit -m 'Visual Lock accelerator: vendor complete pinned asset batch'
          git push origin HEAD:ose-session-visual-lock-strict-2
          echo "FINAL_BATCH_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Dispatch exactly one Visual Fast
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/workflows/ose-visual-fast.yml/dispatches" -f ref=ose-session-visual-lock-strict-2
          echo 'VISUAL_FAST_DISPATCHED_ONCE=YES'
          echo "FINAL_BATCH_COMMIT=${FINAL_BATCH_COMMIT}"
