name: OSE Vendor Session Session Assets

on:
  workflow_dispatch:
  push:
    branches: [ose-session-visual-lock-strict-2]
    paths:
      - ".github/workflows/ose-vendor-session-party-tokens.yml"

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install gdown pillow
      - name: Download canonical Session assets
        run: |
          set -euo pipefail
          mkdir -p ose/web-ui/src/assets
          gdown 1OQz_7afhEZrmOKtDyLPlHA3JOMvI_M03 -O ose/web-ui/src/assets/040_token_guerreiro.png
          gdown 1hmFHr3VPLeaX0LB9DutV3zKv14tKMzgY -O ose/web-ui/src/assets/041_token_mago.png
          gdown 110Vzo_Wjno6ZWmuWeXK0sfG-NOR8fGTx -O ose/web-ui/src/assets/042_token_arqueiro.png
          gdown 17ZRVqcRjrDei-WHnBwaEtkeoDzvs3Feo -O ose/web-ui/src/assets/043_token_ladrao.png
          gdown 1O94_6w5rMOF_opYUEkdB5Aieo4muFPgH -O ose/web-ui/src/assets/007_icone_tocha.png
          gdown 16k2BKUj4_e78veqpg9JdQ6qwphd9hdIr -O ose/web-ui/src/assets/009_status_racoes_4.png
          gdown 1p4pOftnl17X1wnTRnIMoHeCkLZ7p2WBA -O ose/web-ui/src/assets/032_icone_porta.png
      - name: Validate images
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          names=['040_token_guerreiro.png','041_token_mago.png','042_token_arqueiro.png','043_token_ladrao.png','007_icone_tocha.png','009_status_racoes_4.png','032_icone_porta.png']
          for n in names:
              p=Path('ose/web-ui/src/assets')/n
              assert p.stat().st_size > 10000, (n,p.stat().st_size)
              im=Image.open(p); im.verify()
              print(n, p.stat().st_size)
          PY
      - name: Commit canonical Session assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ose/web-ui/src/assets/*.png
          git commit -m "Visual Lock: vendor canonical Session assets" || exit 0
          git push
