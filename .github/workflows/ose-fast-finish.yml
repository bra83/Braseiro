name: BRASEIRO OSE Fast Finish V4 Waves 3-10

on:
  push:
    branches: [ose-fast-finish, ose-fast-finish-v4]
    paths:
      - ".github/workflows/ose-fast-finish.yml"
      - "ose/**"

permissions:
  contents: read

env:
  EXPECTED_ASSET_PACK_SHA256: 63639c6a36d6162d5ac955fe2c4ad6f11a7aeb74364b07cc858e028d683de8c2

jobs:
  waves-3-9:
    name: Waves 3-9 Core Integration Visual Gate
    runs-on: ubuntu-latest
    timeout-minutes: 70
    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - id: source
        run: echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "17"}
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: "8.10.2"}
      - uses: actions/setup-node@v4
        with: {node-version: "22"}

      - name: Verify authority, source and approved asset pack
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ose/gradlew
          test -f ose/gradle/wrapper/gradle-wrapper.jar
          for p in \
            ose/rules-classic/src/main/kotlin/braseiro/ose/rules/classic/ClassicRules.kt \
            ose/rules-advanced/src/main/kotlin/braseiro/ose/rules/advanced/AdvancedRules.kt \
            ose/session-engine/src/main/kotlin/braseiro/ose/session/SessionEngine.kt \
            ose/procedural-dungeon/src/main/kotlin/braseiro/ose/dungeon/DungeonGenerator.kt \
            ose/procedural-hex/src/main/kotlin/braseiro/ose/hex/HexWorldGenerator.kt \
            ose/map-settlement/src/main/kotlin/braseiro/ose/settlement/SettlementDomain.kt \
            ose/npc-domain/src/main/kotlin/braseiro/ose/npc/NpcDomain.kt \
            ose/backup-restore/src/main/kotlin/braseiro/ose/backup/BackupRestore.kt \
            ose/assets/ose-user-pack-v1/BUILD_MANIFEST.json \
            ose/assets/ose-user-pack-v1/ASSET_PACK_INTEGRITY_REPORT.json \
            ose/web-ui-p1/index.html ose/web-ui-p1/p1.js; do test -f "$p"; done
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          r=json.loads(Path('ose/assets/ose-user-pack-v1/ASSET_PACK_INTEGRITY_REPORT.json').read_text())
          s=r['summary']
          assert s['issue_count']==0, s
          assert s['gate']=='PASS', s
          assert s['source_pack_sha256']==os.environ['EXPECTED_ASSET_PACK_SHA256'], s
          assert s['manifest_rows']==676 and s['actual_individual_pngs']==676 and s['actual_asset_sheets']==57, s
          assert all(s['checks'].values()), s
          assert len(list(Path('ose/assets/ose-user-pack-v1').rglob('*.png')))>=676
          print('ASSET_PACK_INTEGRITY=PASS')
          PY
          if grep -R -E '^import .*(dnd|pathfinder|cyclopedia)' ose/rules-* ose/referee-boundary 2>/dev/null; then exit 41; fi

      - name: Build approved P1 web runtime
        working-directory: ose/web-ui
        run: npm run build

      - name: JVM unit integration regression Waves 3-9
        working-directory: ose
        run: >-
          ./gradlew --no-daemon
          :core-model:test :core-rng:test :campaign-domain:test :persistence-api:test :migration-registry:test :persistence-room:test :test-support:test :asset-resolver:test
          :rules-api:test :rules-shared-confirmed:test :rules-classic:test :rules-advanced:test :character-domain:test :referee-boundary:test
          :rag-source-registry:test :barbara-adapter:test :session-engine:test :map-core:test :map-dungeon:test :procedural-dungeon:test :map-hex:test :procedural-hex:test :map-settlement:test
          :npc-domain:test :world-domain:test :tts-api:test :backup-restore:test :integration-tests:test --stacktrace

      - name: Android compile unit lint gate
        working-directory: ose
        run: >-
          ./gradlew --no-daemon :tts-android:testDebugUnitTest :tts-android:lintDebug
          :app-android:testDebugUnitTest :app-android:lintDebug :app-android:compileDebugKotlin --stacktrace

      - name: Install Playwright Chromium
        working-directory: ose/web-ui
        run: npm install --ignore-scripts --no-audit --no-fund && npx playwright install --with-deps chromium
      - name: P1 deterministic capture run 1
        working-directory: ose/web-ui
        run: npm run test:capture && rm -rf /tmp/c1 && cp -a captures /tmp/c1
      - name: P1 deterministic capture run 2
        working-directory: ose/web-ui
        run: npm run test:capture && rm -rf /tmp/c2 && cp -a captures /tmp/c2
      - name: P1 deterministic capture run 3
        working-directory: ose/web-ui
        run: npm run test:capture

      - name: P1 normalized visual regression and architecture invariants
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          import hashlib,json
          names=['P1_SESSION_ACTIVE_415x915.png','P1_SESSION_ENCOUNTER_415x915.png','P1_SESSION_COMBAT_415x915.png','P1_SESSION_RECOVERY_415x915.png','P1_MAP_ACTIVE_415x915.png','P1_SHEET_ACTIVE_415x915.png','P1_COMPANY_ACTIVE_415x915.png']
          alias={'P1_MAP_ACTIVE_415x915.png':'P1_MAP_415x915.png','P1_SHEET_ACTIVE_415x915.png':'P1_SHEET_415x915.png','P1_COMPANY_ACTIVE_415x915.png':'P1_COMPANY_415x915.png'}
          def norm(p):
            im=Image.open(p).convert('RGB'); assert im.size==(415,915),(p,im.size)
            # Must match the approved P1 canonicalizer in web-ui-p1/capture_p1.py exactly.
            return bytes(max(0,min(255,((v+4)//9)*9-4)) for v in im.tobytes())
          out={}
          for n in names:
            ps=[Path('/tmp/c1')/n,Path('/tmp/c2')/n,Path('ose/web-ui/captures')/n]
            ap=Path('ose/web-ui-p1/captures')/alias.get(n,n)
            for p in ps+[ap]: assert p.is_file(),p
            nv=[norm(p) for p in ps]; assert nv[0]==nv[1]==nv[2],n
            av=norm(ap); assert nv[0]==av,n
            out[n]={'normalized_sha256':hashlib.sha256(nv[0]).hexdigest(),'visual_match':'PASS','runs':3}
          d=Path('ose/build/reports/fast-finish');d.mkdir(parents=True,exist_ok=True)
          (d/'p1-captures-v4.json').write_text(json.dumps(out,indent=2))
          PY
          grep -F 'data-channel="PLAYER_REACTION"' ose/web-ui-p1/p1.js >/dev/null
          test "$(grep -o 'data-intentional-mutation="true"' ose/web-ui-p1/p1.js | wc -l)" -eq 1
          grep -F "postNative('GMHelp'" ose/web-ui-p1/p1.js >/dev/null
          grep -F "postNative('TtsCommand'" ose/web-ui-p1/p1.js >/dev/null
          grep -F 'data-direct-movement="forbidden"' ose/web-ui-p1/p1.js >/dev/null
          grep -F 'data-geometry-version="1"' ose/web-ui-p1/p1.js >/dev/null

      - name: Consolidate Waves 3-9 evidence
        shell: bash
        run: |
          python3 - <<'PY'
          import glob,json,subprocess,xml.etree.ElementTree as ET
          from pathlib import Path
          t={'tests':0,'failures':0,'errors':0,'skipped':0}
          for p in glob.glob('ose/**/build/test-results/**/TEST-*.xml',recursive=True):
            r=ET.parse(p).getroot()
            for k in t:t[k]+=int(float(r.attrib.get(k,0)))
          assert t['tests']>0 and t['failures']==0 and t['errors']==0,t
          d={'status':'WAVES_3_9_PASS','sourceSha':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'waves':{str(i):'PASS' for i in range(3,10)},'tests':t,'classicAdvancedIsolation':'PASS','playerReactionSingleMutation':'PASS','gmHelpZeroDelta':'PASS','barbaraSupervisor':'PASS','dungeonDeterminism':'PASS','hexGeometryV1':'PASS','settlementState':'PASS','npcWorldStress':'PASS','backupRestore':'PASS','p1Visual415x915':'PASS','androidCompileLint':'PASS'}
          p=Path('ose/build/reports/fast-finish');p.mkdir(parents=True,exist_ok=True);(p/'waves-3-9.json').write_text(json.dumps(d,indent=2));print(json.dumps(d,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: BRASEIRO_OSE_FAST_FINISH_V4_WAVES_3_9_EVIDENCE
          path: |
            ose/build/reports/fast-finish/**
            ose/**/build/test-results/**
            ose/app-android/build/reports/lint-results-debug.html
            ose/web-ui/captures/*.png
          if-no-files-found: error

  wave-10-android-webview:
    name: Wave 10 Android WebView Emulator Recovery Gate
    needs: waves-3-9
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ needs.waves-3-9.outputs.source_sha }}", fetch-depth: 0}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "17"}
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: "8.10.2"}
      - name: KVM availability gate
        run: test -e /dev/kvm && sudo chmod 666 /dev/kvm
      - name: Instrumented WebView and process recovery
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: >-
            bash -lc 'set -euo pipefail; cd ose; chmod +x gradlew; mkdir -p build/reports/fast-finish/webview; ./gradlew --no-daemon :app-android:connectedDebugAndroidTest --stacktrace 2>&1 | tee build/reports/fast-finish/webview/instrumentation.txt; adb devices -l > build/reports/fast-finish/webview/adb-devices.txt; adb shell dumpsys webviewupdate > build/reports/fast-finish/webview/webviewupdate.txt; adb shell am force-stop braseiro.ose; sleep 2; adb shell monkey -p braseiro.ose -c android.intent.category.LAUNCHER 1 > build/reports/fast-finish/webview/relaunch.txt 2>&1; sleep 6; adb shell pidof braseiro.ose | tee build/reports/fast-finish/webview/pid-after-relaunch.txt; test -s build/reports/fast-finish/webview/pid-after-relaunch.txt; adb logcat -d -v threadtime > build/reports/fast-finish/webview/logcat.txt; if grep -A8 -B2 "FATAL EXCEPTION" build/reports/fast-finish/webview/logcat.txt | grep -F "braseiro.ose"; then exit 44; fi; find . -type f \( -name "*.apk" -o -name "*.aab" \) -delete'
      - name: Wave 10 evidence marker
        run: |
          mkdir -p ose/build/reports/fast-finish/webview
          printf '%s\n' 'WAVE_10=PASS' 'WEBVIEW_INSTRUMENTATION=PASS' 'FORCE_STOP_RELAUNCH=PASS' 'PHYSICAL_DEVICE=NOT_EXECUTED_NO_DEVICE_CONNECTED' 'APK_AAB_DELIVERED=NO' > ose/build/reports/fast-finish/webview/WAVE_10.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: BRASEIRO_OSE_FAST_FINISH_V4_WEBVIEW_EVIDENCE
          path: |
            ose/build/reports/fast-finish/webview/**
            ose/app-android/build/outputs/androidTest-results/**
            ose/app-android/build/reports/androidTests/**
          if-no-files-found: warn

  finalize-wave-10:
    name: Wave 10 Final Android Studio Delivery
    needs: [waves-3-9, wave-10-android-webview]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ needs.waves-3-9.outputs.source_sha }}", fetch-depth: 0}
      - uses: actions/download-artifact@v4
        with: {name: BRASEIRO_OSE_FAST_FINISH_V4_WAVES_3_9_EVIDENCE, path: evidence/waves-3-9}
      - uses: actions/download-artifact@v4
        with: {name: BRASEIRO_OSE_FAST_FINISH_V4_WEBVIEW_EVIDENCE, path: evidence/webview}
      - name: Final report and sole Android Studio ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p final
          SHA="$(git rev-parse HEAD)"
          cat > final/BRASEIRO_OSE_FINAL_REPORT.md <<EOF
          # BRASEIRO OSE — FINAL FAST FINISH V4 REPORT
          COMMAND_REVISION = FAST_FINISH_V4_2026-09-04T04:42-03:00
          STATUS = RELEASE_CANDIDATE_A_E_PASS
          SOURCE_SHA = ${SHA}
          WAVE_3 = PASS
          WAVE_4 = PASS
          WAVE_5 = PASS
          WAVE_6 = PASS
          WAVE_7 = PASS
          WAVE_8 = PASS
          WAVE_9 = PASS
          WAVE_10 = PASS
          PLAYER_REACTION_SINGLE_MUTATION = PASS
          GM_HELP_ZERO_DELTA = PASS
          BARBARA_SUPERVISOR_NOT_RULES_ENGINE = PASS
          TTS_VISIBLE_NARRATION_ONLY = PASS
          HEX_GEOMETRY_V1 = PASS
          P1_VISUAL_415x915 = PASS
          ANDROID_WEBVIEW_EMULATOR = PASS
          FORCE_STOP_RELAUNCH = PASS
          PHYSICAL_DEVICE = NOT_EXECUTED_NO_DEVICE_CONNECTED
          FINAL_APK_AAB_OUTPUT = FORBIDDEN_AND_NOT_DELIVERED
          EOF
          rm -rf ose/.gradle ose/**/build ose/web-ui/node_modules ose/web-ui/test-results ose/web-ui/captures
          find ose -type f \( -name '*.apk' -o -name '*.aab' \) -delete
          zip -qr final/BRASEIRO_OSE_FINAL_ANDROID_STUDIO.zip ose -x '*/node_modules/*' '*/.gradle/*' '*/build/*' '*.apk' '*.aab'
          unzip -t final/BRASEIRO_OSE_FINAL_ANDROID_STUDIO.zip >/dev/null
          ! unzip -l final/BRASEIRO_OSE_FINAL_ANDROID_STUDIO.zip | grep -E '\.(apk|aab)( |$)'
          test -f ose/gradlew && test -f ose/gradle/wrapper/gradle-wrapper.jar && test -f ose/app-android/src/main/AndroidManifest.xml
          sha256sum final/BRASEIRO_OSE_FINAL_ANDROID_STUDIO.zip > final/BRASEIRO_OSE_FINAL_ANDROID_STUDIO.sha256
          sha256sum final/BRASEIRO_OSE_FINAL_REPORT.md > final/BRASEIRO_OSE_FINAL_REPORT.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: BRASEIRO_OSE_FINAL_ANDROID_STUDIO_FAST_FINISH_V4
          path: final/*
          if-no-files-found: error
