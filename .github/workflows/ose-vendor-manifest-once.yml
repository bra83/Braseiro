name: OSE Vendor Canonical Manifest Once

on:
  push:
    branches: [ose-batch-a]
    paths:
      - ".github/workflows/ose-vendor-manifest-once.yml"

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Vendor exact canonical manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet gdown
          mkdir -p ose/assets
          gdown --id 1vSWqtvNEyn8IxWmysHUSIwa3Vd4fzlvA -O ose/assets/ASSET_MANIFEST.json
          echo "769fa3b9893dc8a4108646783740a0caaa9971c6f90fd44d6e9309792e7301e4  ose/assets/ASSET_MANIFEST.json" | sha256sum --check --strict
          python3 - <<'PY'
          import json
          p='ose/assets/ASSET_MANIFEST.json'
          d=json.load(open(p))
          assert d['schema']=='BRASEIRO_VISUAL_FORGE_ASSET_MANIFEST_V2'
          if 'HEX_GEOMETRY_VERSION' in d:
              assert d['HEX_GEOMETRY_VERSION']==1
          assert isinstance(d.get('assets'), list) and len(d['assets']) >= 101
          PY
          cat > ose/assets/manifest-pin.json <<'JSON'
          {
            "drive_file_id": "1vSWqtvNEyn8IxWmysHUSIwa3Vd4fzlvA",
            "canonical_sha256": "769fa3b9893dc8a4108646783740a0caaa9971c6f90fd44d6e9309792e7301e4",
            "schema": "BRASEIRO_VISUAL_FORGE_ASSET_MANIFEST_V2",
            "repository_path": "ose/assets/ASSET_MANIFEST.json",
            "source_classification": "VENDORED_CANONICAL_BUILD_INPUT",
            "provenance_note": "Google Drive remains the documentary/original authority. This Git copy is an exact-byte reproducible build pin."
          }
          JSON
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ose/assets/ASSET_MANIFEST.json ose/assets/manifest-pin.json
          git rm .github/workflows/ose-vendor-manifest-once.yml
          git commit -m "Vendor exact canonical OSE asset manifest"
          git push origin HEAD:ose-batch-a
