name: BRASEIRO OSE Batch Vendor Pinned Assets
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  vendor-batch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ose-session-visual-lock-strict-2
          fetch-depth: 1

      - name: Reconstruct definitive bootstrap atomically
        shell: bash
        working-directory: ose/web-ui
        run: |
          set -u
          python3 - <<'PY'
          import base64, hashlib, json, re, shutil, struct
          from pathlib import Path

          root = Path('src/assets')
          boot = root / '.bootstrap-definitive'
          pin = json.loads((root / 'VISUAL_LOCK_BINARY_PIN.json').read_text())
          by_name = {e['filename']: e for e in pin['files']}
          sig = b'\x89PNG\r\n\x1a\n'
          part_re = re.compile(r'^(?P<stem>.+)\.part(?P<idx>\d{4})\.b64$')

          groups = {}
          if boot.is_dir():
              for p in boot.iterdir():
                  m = part_re.match(p.name)
                  if not m:
                      continue
                  groups.setdefault(m.group('stem'), []).append((int(m.group('idx')), p))

          for stem, parts in sorted(groups.items()):
              filename = stem + '.png'
              e = by_name.get(filename)
              if not e:
                  print(f'BOOTSTRAP_UNKNOWN={filename}')
                  continue
              parts.sort(key=lambda x: x[0])
              idxs = [i for i,_ in parts]
              first, last = idxs[0], idxs[-1]
              expected = list(range(first, last + 1))
              gaps = [i for i in expected if i not in idxs]
              print(f'BOOTSTRAP_CHUNKS={filename} count={len(parts)} first={first} last={last} gaps={gaps}')
              if first != 1 or gaps:
                  print(f'BOOTSTRAP_INCOMPLETE={filename}')
                  continue

              text = ''.join(p.read_text(encoding='ascii').replace('\r','').replace('\n','') for _,p in parts)
              if re.fullmatch(r'[A-Za-z0-9+/]*={0,2}', text) is None or len(text) % 4 != 0:
                  print(f'BOOTSTRAP_INVALID={filename} reason=characters_or_padding')
                  continue
              if '=' in text[:-2]:
                  print(f'BOOTSTRAP_INVALID={filename} reason=padding_position')
                  continue

              tmp = root / (filename + '.tmp')
              tmp.unlink(missing_ok=True)
              try:
                  data = base64.b64decode(text, validate=True)
                  tmp.write_bytes(data)
              except Exception as exc:
                  print(f'BOOTSTRAP_INVALID={filename} reason=decode error={exc!r}')
                  tmp.unlink(missing_ok=True)
                  continue

              try:
                  data = tmp.read_bytes()
                  got = hashlib.sha256(data).hexdigest()
                  if got != e['sha256']:
                      raise ValueError(f'sha {got} != {e["sha256"]}')
                  if len(data) < 24 or data[:8] != sig or data[12:16] != b'IHDR':
                      raise ValueError('png signature/IHDR')
                  w,h = struct.unpack('>II', data[16:24])
                  if (w,h) != (e['width'], e['height']):
                      raise ValueError(f'dim {(w,h)} != {(e["width"],e["height"])}')
              except Exception as exc:
                  print(f'BOOTSTRAP_INVALID={filename} reason=integrity error={exc!r}')
                  tmp.unlink(missing_ok=True)
                  continue

              tmp.replace(root / filename)
              print(f'BOOTSTRAP_READY={filename}')
          PY

      - name: Report integrity before fallback fetch
        shell: bash
        working-directory: ose/web-ui
        run: |
          python3 scripts/validate_visual_lock_assets.py || true

      - name: Fetch every remaining pin in one batch
        shell: bash
        working-directory: ose/web-ui
        run: |
          set -u
          python3 -m pip install --disable-pip-version-check --quiet 'gdown==5.2.0'
          python3 - <<'PY'
          import hashlib, json, shutil, struct
          from pathlib import Path
          import gdown

          root = Path('src/assets')
          pin = json.loads((root/'VISUAL_LOCK_BINARY_PIN.json').read_text())
          sig = b'\x89PNG\r\n\x1a\n'

          def exact(path, e):
              if not path.is_file() or path.stat().st_size <= 0:
                  return False
              b = path.read_bytes()
              if hashlib.sha256(b).hexdigest() != e['sha256']:
                  return False
              if len(b) < 24 or b[:8] != sig or b[12:16] != b'IHDR':
                  return False
              return struct.unpack('>II', b[16:24]) == (e['width'], e['height'])

          failures = []
          for e in pin['files']:
              out = root / e['filename']
              if exact(out, e):
                  print('PIN_READY', e['filename'])
                  continue
              tmp = root / (e['filename'] + '.download')
              tmp.unlink(missing_ok=True)
              ok = False
              for cookies in (True, False):
                  try:
                      got = gdown.download(id=e['source_drive_file_id'], output=str(tmp), quiet=False, use_cookies=cookies)
                  except Exception as exc:
                      print('GDOWN_EXCEPTION', e['filename'], repr(exc))
                      got = None
                  if got and exact(tmp, e):
                      tmp.replace(out)
                      ok = True
                      print('PIN_FETCHED', e['filename'])
                      break
                  if tmp.exists():
                      print('GDOWN_REJECT', e['filename'], hashlib.sha256(tmp.read_bytes()).hexdigest(), tmp.stat().st_size)
                      tmp.unlink()
              if not ok:
                  failures.append(e['filename'])
          if failures:
              print('FALLBACK_UNRESOLVED=' + ','.join(failures))
          PY

      - name: Validate complete pin batch before Playwright
        shell: bash
        working-directory: ose/web-ui
        run: |
          set -euo pipefail
          python3 scripts/validate_visual_lock_assets.py

      - name: Clean bootstrap residue and retire vendor workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -rf ose/web-ui/src/assets/.bootstrap-a201 \
                 ose/web-ui/src/assets/.bootstrap-a202 \
                 ose/web-ui/src/assets/.bootstrap-special \
                 ose/web-ui/src/assets/.bootstrap-final \
                 ose/web-ui/src/assets/.bootstrap-definitive
          git rm .github/workflows/ose-vendor-session-assets-once.yml

      - name: Commit complete canonical batch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'braseiro-build-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add ose/web-ui/src/assets ose/web-ui/scripts/validate_visual_lock_assets.py .github/workflows/ose-visual-fast.yml
          git commit -m 'Visual Lock bootstrap hotfix: vendor 20 validated pinned binaries'
          git push origin HEAD:ose-session-visual-lock-strict-2
          echo "FINAL_BATCH_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Dispatch exactly one Visual Fast
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/workflows/ose-visual-fast.yml/dispatches" -f ref=ose-session-visual-lock-strict-2
          echo 'VISUAL_FAST_DISPATCHED_ONCE=YES'
          echo "FINAL_BATCH_COMMIT=${FINAL_BATCH_COMMIT}"
